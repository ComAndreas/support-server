<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DEVELOPERS - Community Andreas</title>
  <style>
    :root {
      --bg-color: #0b0d12;
      --card-bg: #141824;
      --card-border: #262c40;
      --accent-color: #4f46e5;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-x: hidden;
    }

    /* Header */
    header {
      text-align: center;
      padding: 40px 20px 20px;
    }

    header h1 {
      font-size: 3rem;
      letter-spacing: 4px;
      font-weight: 800;
      text-transform: uppercase;
      color: #ffffff;
      margin-bottom: 8px;
    }

    header p {
      font-size: 1.25rem;
      color: var(--text-muted);
      font-weight: 500;
      letter-spacing: 1px;
    }

    /* Floating Avatars Rows */
    .avatar-rows-container {
      display: flex;
      flex-direction: column;
      gap: 25px;
      padding: 30px 0;
      overflow: hidden;
      position: relative;
    }

    .row {
      display: flex;
      width: max-content;
    }

    .row-inner {
      display: flex;
      gap: 30px;
      animation: scroll 25s linear infinite;
    }

    .row-inner.reverse {
      animation-direction: reverse;
    }

    .row-inner.slow {
      animation-duration: 35s;
    }

    @keyframes scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    .avatar-item {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      cursor: pointer;
      border: 3px solid var(--card-border);
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      object-fit: cover;
    }

    .avatar-item:hover {
      transform: scale(1.15);
      border-color: var(--accent-color);
      box-shadow: 0 0 15px rgba(79, 70, 229, 0.4);
    }

    /* Modal / Popup Card */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s ease, visibility 0.4s ease;
      z-index: 100;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .flip-card {
      width: 580px;
      height: 320px;
      perspective: 1000px;
      transform: scale(0.6) rotate(-5deg);
      transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-overlay.active .flip-card {
      transform: scale(1) rotate(0deg);
    }

    .flip-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: left;
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
    }

    .flip-card.flipped .flip-card-inner {
      transform: rotateY(180deg);
    }

    .flip-card-front, .flip-card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 16px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      padding: 30px;
    }

    /* Front Side */
    .flip-card-front {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }

    .flip-card-front img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3px solid var(--accent-color);
    }

    .flip-card-front h2 {
      font-size: 1.5rem;
      letter-spacing: 1px;
    }

    .flip-card-front p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* Back Side */
    .flip-card-back {
      transform: rotateY(180deg);
      display: flex;
      justify-content: space-between;
      gap: 20px;
    }

    .close-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
      transition: color 0.2s ease;
      z-index: 10;
    }

    .close-btn:hover {
      color: #ffffff;
    }

    .card-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .card-section.left {
      border-right: 1px solid var(--card-border);
      padding-right: 20px;
    }

    .card-section.right {
      padding-left: 10px;
    }

    .card-section h3 {
      font-size: 1.1rem;
      color: var(--accent-color);
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .info-group {
      margin-bottom: 12px;
    }

    .info-group label {
      display: block;
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .info-group span, .info-group a {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
      text-decoration: none;
    }

    .info-group a:hover {
      color: var(--accent-color);
      text-decoration: underline;
    }

    /* Footer / Info Section */
    footer {
      background: #0f121a;
      border-top: 1px solid var(--card-border);
      padding: 30px 20px;
      text-align: center;
    }

    .footer-content {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
    }

    .footer-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
    }

    .footer-item span {
      color: var(--text-muted);
    }

    .footer-item a {
      color: var(--text-main);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    .footer-item a:hover {
      color: var(--accent-color);
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header>
    <h1>DEVELOPERS</h1>
    <p>Community Andreas</p>
  </header>

  <!-- Animated Flying Avatars (3 Rows) -->
  <div class="avatar-rows-container">
    <div class="row">
      <div class="row-inner" id="row-1"></div>
    </div>
    <div class="row">
      <div class="row-inner reverse slow" id="row-2"></div>
    </div>
    <div class="row">
      <div class="row-inner" id="row-3"></div>
    </div>
  </div>

  <!-- Modal / Interactive Card -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="flip-card" id="flipCard">
      <div class="flip-card-inner">
        
        <!-- Card Front -->
        <div class="flip-card-front">
          <img id="cardAvatar" src="" alt="Avatar" />
          <h2 id="cardName">Developer</h2>
          <p>Загрузка данных...</p>
        </div>

        <!-- Card Back -->
        <div class="flip-card-back">
          <button class="close-btn" id="closeBtn">&times;</button>
          
          <div class="card-section left">
            <h3>Информация</h3>
            <div class="info-group">
              <label>Роль</label>
              <span id="cardRole">-</span>
            </div>
            <div class="info-group">
              <label>Дата вступления</label>
              <span id="cardJoinDate">-</span>
            </div>
            <div class="info-group">
              <label>Дней на стаже</label>
              <span id="cardTenure">-</span>
            </div>
          </div>

          <div class="card-section right">
            <h3>Контакты</h3>
            <div class="info-group">
              <label>Discord</label>
              <span id="cardDiscord">-</span>
            </div>
            <div class="info-group">
              <label>Email</label>
              <span id="cardEmail">-</span>
            </div>
            <div class="info-group" id="corpEmailGroup" style="display: none;">
              <label>Corp Email</label>
              <span id="cardCorpEmail">-</span>
            </div>
            <div class="info-group">
              <label>GitHub</label>
              <a id="cardGithub" href="#" target="_blank">-</a>
            </div>
          </div>

        </div>

      </div>
    </div>
  </div>

  <!-- Footer Links Section -->
  <footer>
    <div class="footer-content">
      <div class="footer-item">
        <span>Discord:</span>
        <a href="https://dsc.gg/comgta" target="_blank">dsc.gg/comgta</a>
      </div>
      <div class="footer-item">
        <span>GitHub:</span>
        <a href="https://github.com/ComAndreas" target="_blank">git.com/ComAndreas</a>
      </div>
      <div class="footer-item">
        <span>Telegram:</span>
        <a href="https://t.me/comandreas" target="_blank">t.me/comandreas</a>
      </div>
      <div class="footer-item">
        <span>Email:</span>
        <a href="mailto:communityandreas@gmail.com">communityandreas@gmail.com</a>
      </div>
    </div>
  </footer>

  <script>
    // Developer Profiles Data
    const developers = [
      {
        id: '0x03C9',
        name: '0x03C9',
        avatar: 'https://avatars.githubusercontent.com/u/288679879?v=4',
        role: 'Разработчик',
        joinDate: '12.08.2026',
        discord: 'karbyurator7',
        email: 'Не указан',
        corpEmail: null,
        githubUrl: 'https://github.com/0x03C9',
        githubUser: '0x03C9'
      },
      {
        id: 'JunDevX',
        name: 'JunDevX',
        avatar: 'https://avatars.githubusercontent.com/u/292096788?v=4',
        role: 'Создатель',
        joinDate: '05.08.2026',
        discord: 'sanek2k11',
        email: 'oxtcoree@gmail.com',
        corpEmail: 'communityandreas@gmail.com',
        githubUrl: 'https://github.com/JunDevX',
        githubUser: 'JunDevX'
      }
    ];

    // Helper: Days formatting in Russian
    function getDaysText(startDateStr) {
      const parts = startDateStr.split('.');
      const startDate = new Date(parts[2], parts[1] - 1, parts[0]);
      const now = new Date();
      
      const diffTime = Math.max(0, now - startDate);
      const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

      const lastTwo = diffDays % 100;
      const lastOne = diffDays % 10;

      let suffix = 'дней';
      if (lastTwo < 11 || lastTwo > 14) {
        if (lastOne === 1) suffix = 'день';
        else if (lastOne >= 2 && lastOne <= 4) suffix = 'дня';
      }

      return `${diffDays} ${suffix}`;
    }

    // Populate Infinite Rows
    function populateRows() {
      const rows = ['row-1', 'row-2', 'row-3'];
      rows.forEach((rowId) => {
        const rowEl = document.getElementById(rowId);
        // Duplicate elements to create continuous infinite loop
        for (let i = 0; i < 10; i++) {
          developers.forEach((dev) => {
            const img = document.createElement('img');
            img.src = dev.avatar;
            img.alt = dev.name;
            img.className = 'avatar-item';
            img.addEventListener('click', () => openModal(dev));
            rowEl.appendChild(img);
          });
        }
      });
    }

    // Modal Control
    const modalOverlay = document.getElementById('modalOverlay');
    const flipCard = document.getElementById('flipCard');
    const closeBtn = document.getElementById('closeBtn');

    function openModal(dev) {
      // Set Data
      document.getElementById('cardAvatar').src = dev.avatar;
      document.getElementById('cardName').textContent = dev.name;
      document.getElementById('cardRole').textContent = dev.role;
      document.getElementById('cardJoinDate').textContent = dev.joinDate;
      document.getElementById('cardTenure').textContent = getDaysText(dev.joinDate);
      document.getElementById('cardDiscord').textContent = dev.discord;
      document.getElementById('cardEmail').textContent = dev.email;

      const corpGroup = document.getElementById('corpEmailGroup');
      if (dev.corpEmail) {
        corpGroup.style.display = 'block';
        document.getElementById('cardCorpEmail').textContent = dev.corpEmail;
      } else {
        corpGroup.style.display = 'none';
      }

      const githubLink = document.getElementById('cardGithub');
      githubLink.href = dev.githubUrl;
      githubLink.textContent = dev.githubUser;

      // Animation steps
      flipCard.classList.remove('flipped');
      modalOverlay.classList.add('active');

      setTimeout(() => {
        flipCard.classList.add('flipped');
      }, 300);
    }

    function closeModal() {
      flipCard.classList.remove('flipped');
      setTimeout(() => {
        modalOverlay.classList.remove('active');
      }, 300);
    }

    closeBtn.addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) closeModal();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    // Initialize
    populateRows();
  </script>
</body>
</html>
